<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Calculator Pre?</title>

<style>
    body {
        font-family: Arial, sans-serif;
        max-width: 500px;
        margin: auto;
        padding: 20px;
        text-align: center;
        font-size: 22px;
    }

    h2 {
        font-size: 32px;
    }

    input {
        width: 100%;
        font-size: 30px;
        padding: 15px;
        text-align: right;
        box-sizing: border-box;
        margin-bottom: 20px;
    }

    .numpad {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 10px;
        margin-bottom: 20px;
    }

    .numpad button {
        font-size: 30px;
        padding: 20px;
    }

    .procente {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 10px;
        margin-bottom: 20px;
    }

    .procente button {
        font-size: 22px;
        padding: 15px;
    }

    h3 {
        font-size: 26px;
        text-align: left;
    }
</style>
</head>
<body>

<h2>Calculator Pre?</h2>

<input type="text" id="nr" readonly placeholder="0">

<div class="numpad">
    <button onclick="adauga('1')">1</button>
    <button onclick="adauga('2')">2</button>
    <button onclick="adauga('3')">3</button>

    <button onclick="adauga('4')">4</button>
    <button onclick="adauga('5')">5</button>
    <button onclick="adauga('6')">6</button>

    <button onclick="adauga('7')">7</button>
    <button onclick="adauga('8')">8</button>
    <button onclick="adauga('9')">9</button>

    <button onclick="stergeUltimul()">?</button>
    <button onclick="adauga('0')">0</button>
    <button onclick="stergeTot()">C</button>
</div>

<div class="procente">
    <button onclick="calculeaza(10.5)">10,5%</button>
    <button onclick="calculeaza(11)">11%</button>
    <button onclick="calculeaza(11.5)">11,5%</button>
    <button onclick="calculeaza(12)">12%</button>
</div>

<h3 id="net">Pre? net: 0</h3>
<h3 id="comision">Comision: 0</h3>
<h3 id="brut">Pre? brut: 0</h3>

<script>
function adauga(cifra) {
    document.getElementById("nr").value += cifra;
}

function stergeUltimul() {
    let x = document.getElementById("nr");
    x.value = x.value.slice(0, -1);
}

function stergeTot() {
    document.getElementById("nr").value = "";

    document.getElementById("net").innerText = "Pre? net: 0";
    document.getElementById("comision").innerText = "Comision: 0";
    document.getElementById("brut").innerText = "Pre? brut: 0";
}

function calculeaza(procent) {
    let nr = parseFloat(document.getElementById("nr").value);

    if (isNaN(nr))
        return;

    let pretNet = nr - nr * (procent / 100);

    let comision = 0;

    if (pretNet <= 599)
        comision = 50;
    else if (pretNet <= 699)
        comision = 60;
    else if (pretNet <= 799)
        comision = 70;
    else if (pretNet <= 999)
        comision = 80;
    else if (pretNet <= 1999)
        comision = 90;
    else if (pretNet <= 3999)
        comision = 100;
    else if (pretNet <= 5999)
        comision = 150;
    else if (pretNet < 7499)
        comision = 200;
    else
        comision = 250;

    let pretBrut = pretNet + comision;

    document.getElementById("net").innerText =
        "Pre? net: " + Math.round(pretNet);

    document.getElementById("comision").innerText =
        "Comision: " + comision;

    document.getElementById("brut").innerText =
        "Pre? brut: " + Math.round(pretBrut);
}
</script>

</body>
</html>
